glob_matcher: doublestar

commit-msg:
  commands:
    conventional:
      run: ./scripts/commit-msg.sh "{1}"

pre-commit:
  parallel: true
  commands:
    python-lint:
      glob: "**/*.{py,pyi}"
      run: just lint {staged_files}
    python-format:
      glob: "**/*.{py,pyi}"
      run: just fmt-check {staged_files}
    python-types:
      glob: "**/*.{py,pyi}"
      run: just typecheck
    traceability:
      glob: "{hw2/traceability.py,hw2/artifacts/*.{py,json}}"
      run: just check-trace hw2
    goal-models:
      glob: "{hw2/artifacts/goal_model_*.py,hw2/check_models.py}"
      run: just check-goals hw2
    scripts:
      glob: "**/*.sh"
      run: just lint-scripts {staged_files}
    nix:
      glob: "**/*.nix"
      run: just fmt-check-nix {staged_files}
